<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18212f"><title>מערכת הבקרות היחידתית</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body><section id="authView" class="auth-view"><div class="auth-card"><div class="brand-icon">✓</div><div class="eyebrow">מערכת בקרות</div><h1>מערכת הבקרות היחידתית</h1><p>גישה למשתמשים פעילים ומורשים בלבד.</p><form id="loginForm" class="stack"><label>דוא״ל<input id="loginEmail" type="email" autocomplete="email" required></label><label>סיסמה<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">כניסה למערכת</button></form><div id="authMessage" class="message"></div></div></section><section id="appView" class="app hidden"><aside class="sidebar"><div class="sidebar-brand"><div class="brand-icon small">✓</div><div><strong id="systemTitle">מערכת הבקרות היחידתית</strong><span>ניהול ובקרה</span></div></div><nav id="navList" class="nav-list"></nav><div class="sidebar-footer"><div id="currentUser" class="current-user"></div><button id="logoutBtn" class="btn sidebar-btn" type="button">התנתקות</button></div></aside><div class="workspace"><header class="mobile-header"><button id="menuBtn" class="icon-btn" type="button">☰</button><strong id="mobileTitle">מערכת הבקרות היחידתית</strong></header><main id="pageRoot" class="page-root"></main></div></section><dialog id="entityDialog" class="modal"><form id="entityForm" method="dialog" class="modal-form"></form></dialog><dialog id="confirmDialog" class="modal small-modal"><div class="confirm-box"><h3>אישור פעולה</h3><p id="confirmText"></p><div class="dialog-actions"><button id="confirmCancel" class="btn ghost">ביטול</button><button id="confirmOk" class="btn danger">אישור</button></div></div></dialog><div id="toast" class="toast"></div><div id="pdfStage" class="pdf-stage"></div><script type="module" src="/app.js"></script></body></html>
